<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ગણેશોત્સવ ફોટો ફ્રેમ</title>

  <!-- Google Fonts for Gujarati Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anek+Gujarati:wght@500;700;800&family=Rasa:wght@600;700&display=swap" rel="stylesheet">

  <style>
    /* CSS Variables for Easy Theme Tuning */
    :root {
      --bg-dark: #120304;
      --bg-radial: radial-gradient(circle at 50% 20%, #3d0d0d 0%, #170405 60%, #0d0203 100%);
      --gold-gradient: linear-gradient(135deg, #ffe57f 0%, #f6c042 50%, #d49a1d 100%);
      --gold-solid: #f6c042;
      --gold-border: rgba(246, 192, 66, 0.4);
      --gold-glow: rgba(246, 192, 66, 0.25);
      --text-cream: #fae8d2;
      --font-heading: 'Rasa', serif;
      --font-body: 'Anek Gujarati', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: var(--bg-radial);
      background-attachment: fixed;
      font-family: var(--font-body);
      color: var(--text-cream);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    /* Metallic Golden Gradient Effect */
    .golden-text {
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 8px rgba(246, 192, 66, 0.35));
    }

    /* Main Container */
    .wrapper {
      width: 100%;
      max-width: 540px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .main-title {
      font-family: var(--font-heading);
      font-size: clamp(1.8rem, 5vw, 2.5rem);
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .sub-title {
      font-size: clamp(0.95rem, 2.8vw, 1.15rem);
      color: var(--text-cream);
      font-weight: 500;
      opacity: 0.92;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .organizer-badge {
      display: inline-block;
      font-size: 0.85rem;
      color: var(--gold-solid);
      border-bottom: 1px dashed var(--gold-border);
      padding-bottom: 3px;
      margin-bottom: 8px;
    }

    /* Card Wrapper */
    .upload-card {
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--gold-border);
      border-radius: 20px;
      padding: 24px 20px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6), inset 0 0 20px var(--gold-glow);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .box-header {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--gold-solid);
      text-align: left;
    }

    /* Dashed Upload Box */
    .upload-zone {
      position: relative;
      width: 100%;
      min-height: 220px;
      border: 2px dashed rgba(246, 192, 66, 0.55);
      border-radius: 14px;
      background: rgba(0, 0, 0, 0.25);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
      transition: border-color 0.25s ease, background-color 0.25s ease, transform 0.15s ease;
      padding: 20px;
    }

    .upload-zone:hover {
      border-color: #ffe57f;
      background: rgba(246, 192, 66, 0.05);
      transform: translateY(-2px);
    }

    .upload-zone input[type="file"] {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    .upload-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      pointer-events: none;
    }

    .upload-icon {
      width: 48px;
      height: 48px;
      fill: none;
      stroke: var(--gold-solid);
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 2px 6px rgba(246, 192, 66, 0.4));
    }

    .upload-label {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-cream);
    }

    .upload-hint {
      font-size: 0.8rem;
      opacity: 0.65;
    }

    /* Image Preview Mode */
    .preview-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      display: none;
    }

    /* Gold CTA Button */
    .golden-btn {
      background: var(--gold-gradient);
      color: #210707;
      font-family: var(--font-body);
      font-size: 1.05rem;
      font-weight: 700;
      border: none;
      padding: 13px 28px;
      border-radius: 30px;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 4px 18px rgba(246, 192, 66, 0.35);
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .golden-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(246, 192, 66, 0.55);
      filter: brightness(1.06);
    }

    .golden-btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <main class="wrapper">
    <!-- Header Titles -->
    <h1 class="main-title golden-text">|| શ્રી ગણપતિ બાપ્પા મોરિયા ||</h1>
    <p class="sub-title">🙏 આવો, ભક્તિ, શ્રદ્ધા અને આનંદ સાથે બાપ્પાનું સ્વાગત કરીએ! 🙏</p>
    <div class="organizer-badge">ફ્રેન્ડ્સ ગ્રૂપ દ્વારા આયોજિત</div>

    <!-- Upload Card -->
    <div class="upload-card">
      <div class="box-header">તમારો ફોટો</div>

      <div class="upload-zone" id="dropZone">
        <input type="file" id="fileInput" accept="image/*" aria-label="તમારો ફોટો પસંદ કરો">
        <img id="imagePreview" class="preview-img" alt="Uploaded Preview">

        <div class="upload-content" id="uploadPlaceholder">
          <!-- Camera SVG Icon -->
          <svg class="upload-icon" viewBox="0 0 24 24">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
            <circle cx="12" cy="13" r="4"></circle>
          </svg>
          <span class="upload-label">અહીં ક્લિક કરી ફોટો પસંદ કરો</span>
          <span class="upload-hint">PNG, JPG અથવા JPEG (મહત્તમ 10MB)</span>
        </div>
      </div>

      <button type="button" class="golden-btn" id="generateBtn">
        ફ્રેમ બનાવો 📸
      </button>
    </div>
  </main>

  <script>
    const fileInput = document.getElementById('fileInput');
    const imagePreview = document.getElementById('imagePreview');
    const uploadPlaceholder = document.getElementById('uploadPlaceholder');

    // Live preview handler
    fileInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          imagePreview.src = event.target.result;
          imagePreview.style.display = 'block';
          uploadPlaceholder.style.display = 'none';
        };
        reader.readAsDataURL(file);
      }
    });
  </script>

</body>
</html>
